    <title>El Pedro Barbearia | Links Oficiais</title>

    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #f0d060;
            --silver: #C0C0C0;
            --text-white: #ffffff;
            --btn-bg: rgba(0, 0, 0, 0.55);
            --btn-hover: rgba(212, 175, 55, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px 60px;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Fundo com imagem de barbearia ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=1200&q=80');
            background-size: cover;
            background-position: center top;
            filter: brightness(0.28) saturate(0.6);
            z-index: -2;
        }

        /* Overlay com gradiente dourado sutil */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,0.45) 0%,
                rgba(10,8,2,0.65) 50%,
                rgba(0,0,0,0.80) 100%
            );
            z-index: -1;
        }

        .wrapper {
            width: 100%;
            max-width: 460px;
            text-align: center;
            position: relative;
        }

        /* ── Perfil / Logo ── */
        .profile-container {
            margin-bottom: 32px;
            animation: fadeDown 0.8s ease both;
        }

        .logo-ring {
            display: inline-block;
            padding: 5px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--gold), #7a5f10, var(--gold-light));
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.45);
            margin-bottom: 18px;
        }

        .profile-logo {
            width: 126px;
            height: 126px;
            border-radius: 50%;
            display: block;
            object-fit: cover;
            background: #0d0d0d;
            border: 3px solid #0d0d0d;
        }

        /* ── Título com fonte da logo ── */
        .title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(212, 175, 55, 0.5), 0 0 40px rgba(212,175,55,0.15);
            line-height: 1.25;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 300;
            color: #aaa;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* ── Divisor dourado ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            opacity: 0.6;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold));
        }
        .divider::after {
            background: linear-gradient(90deg, var(--gold), transparent);
        }
        .divider i { color: var(--gold); font-size: 12px; }

        /* ── Links ── */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-item {
            display: flex;
            align-items: center;
            background: var(--btn-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(192, 192, 192, 0.18);
            padding: 17px 25px;
            border-radius: 50px;
            text-decoration: none;
            color: var(--text-white);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.7s ease both;
        }

        .link-item:nth-child(1) { animation-delay: 0.15s; }
        .link-item:nth-child(2) { animation-delay: 0.25s; }
        .link-item:nth-child(3) { animation-delay: 0.35s; }
        .link-item:nth-child(4) { animation-delay: 0.45s; }

        .link-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(212,175,55,0.06) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .link-item:hover {
            background: var(--btn-hover);
            border-color: var(--gold);
            transform: scale(1.025);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }
        .link-item:hover::before { opacity: 1; }

        .link-item i {
            font-size: 19px;
            width: 28px;
            color: var(--gold);
            flex-shrink: 0;
        }

        .link-text {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 1.5px;
            margin-right: 28px;
        }

        /* Destaque botão agendamento */
        .pulse {
            border-color: var(--gold) !important;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
        }
        .pulse .link-text {
            color: var(--gold-light);
        }

        /* ── Info ── */
        .info-section {
            margin-top: 36px;
            padding: 18px 22px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 18px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            animation: fadeUp 0.7s 0.55s ease both;
        }

        .info-section p {
            font-size: 12.5px;
            color: #bbb;
            line-height: 1.7;
            margin-bottom: 6px;
        }
        .info-section p:last-child { margin-bottom: 0; }
        .info-section i { color: var(--gold); margin-right: 8px; }

        /* ── Footer ── */
        .footer {
            margin-top: 40px;
            font-size: 10px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fadeUp 0.7s 0.65s ease both;
        }

        /* ── WhatsApp float ── */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: white;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
            z-index: 999;
            transition: 0.3s;
            text-decoration: none;
        }
        .whatsapp-float:hover { transform: scale(1.12); }

        /* ── Animações ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
